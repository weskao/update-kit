name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  test:
    name: Python 3.10 / ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.10"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest -v
      - name: Build distributions
        run: uv build
      - name: Validate wheel is importable standalone
        shell: python
        run: |
          import os
          import pathlib
          import subprocess
          import tempfile

          wheel, = pathlib.Path("dist").glob("*.whl")
          with tempfile.TemporaryDirectory() as directory:
              environment = pathlib.Path(directory)
              subprocess.run(["uv", "venv", environment], check=True)
              scripts = environment / ("Scripts" if os.name == "nt" else "bin")
              python = scripts / ("python.exe" if os.name == "nt" else "python")
              subprocess.run(
                  ["uv", "pip", "install", "--python", python, "--no-index", wheel],
                  check=True,
              )
              subprocess.run([python, "-I", "-c", "import update_kit"], check=True)
              print("update_kit imports standalone OK")

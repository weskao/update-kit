[project]
name = "update-kit"
dynamic = ["version"]
description = "Self-update for git-tag-released Python CLIs (uv tool / pipx). Stdlib only."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/update_kit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/update_kit"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.15.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# On top of ruff's default set: import order, pyupgrade, and two bug-catching B rules.
extend-select = ["I", "UP", "B023", "B904"]
